<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Using marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify for security -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TN5ZW0Y0T3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-TN5ZW0Y0T3');

</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Crustdata Assistant</h1>
            <div class="header-right">
                <a href="https://app.notion.com/p/Crustdata-AI-Assistant-MVP-Memory-Efficient-Rebuild-3af1e96bce41803d89c6c4265d96e809" target="_blank" rel="noopener noreferrer" class="header-link-btn notion-btn" aria-label="Solution Documentation">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                    <span>Solution Doc</span>
                </a>
                <a href="https://github.com/Bhaveshupadhyay/crustdata-assistant" target="_blank" rel="noopener noreferrer" class="header-link-btn github-btn" aria-label="GitHub Repository">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                    </svg>
                    <span>GitHub</span>
                </a>
                <button type="button" id="watch-demo-btn" class="watch-demo-btn" aria-label="Watch demo video">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span>Watch Demo</span>
                </button>
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    Online
                </div>
            </div>
        </header>

        <main id="chat-container" class="chat-container">
            <div class="welcome-message">
                <h2>How can I help you today?</h2>
                <p>Ask me anything or request API information.</p>
            </div>
        </main>

        <div class="input-container">
            <form id="chat-form" class="chat-form">
                <div class="input-wrapper">
                    <textarea id="user-input" placeholder="Message Crustdata..." rows="1" autofocus></textarea>
                    <button type="submit" id="send-btn" class="send-btn" aria-label="Send message" disabled>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </form>
            <div class="footer-text">AI can make mistakes. Consider verifying important information.</div>
        </div>
    </div>

    <!-- Demo Video Modal -->
    <div id="video-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Watch a Demo Video</h3>
                <button type="button" id="close-modal-btn" class="close-modal-btn" aria-label="Close demo video">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-video-container">
                    <iframe 
                        id="demo-video-iframe"
                        src="" 
                        data-src="https://drive.google.com/file/d/1x3E7ly1cKtVrtXKr9gz6YGHv9kh7e0DU/preview" 
                        title="Watch a Demo Video"
                        allow="autoplay; encrypted-media" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
